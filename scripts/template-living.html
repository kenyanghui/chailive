<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="chailive · 拆生活指南：31 个生活主题章，19262 张拆页卡片，说人话摘要与可展开的 RIA 便签。单文件、零依赖、可离线阅读。">
<title>chailive · 拆生活指南</title>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#ffffff;--bg-alt:#f6f6f7;--bg-elv:#ffffff;--bg-mute:#f1f1f2;
  --divider:#e2e2e3;
  --t1:rgba(60,60,67,1);--t2:rgba(60,60,67,.78);--t3:rgba(60,60,67,.56);
  --brand-1:#8d6e3c;--brand-2:#a58450;--brand-soft:rgba(180,140,70,.12);
  --ga:#18794e;--ga-soft:rgba(16,185,129,.12);
  --gb:#915930;--gb-soft:rgba(234,179,8,.15);
  --gc:#565a5f;--gc-soft:rgba(142,150,170,.15);
  --mark:rgba(234,179,8,.34);
  --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  --bar:56px;--side:280px;
}
[data-theme=dark]{
  --bg:#1b1b1f;--bg-alt:#161618;--bg-elv:#202127;--bg-mute:#2b2b2f;
  --divider:#2e2e32;
  --t1:rgba(255,255,245,.88);--t2:rgba(235,235,245,.62);--t3:rgba(235,235,245,.4);
  --brand-1:#d4b483;--brand-2:#e0c39a;--brand-soft:rgba(180,140,70,.16);
  --ga:#3dd68c;--ga-soft:rgba(16,185,129,.14);
  --gb:#f9b44e;--gb-soft:rgba(234,179,8,.16);
  --gc:#a4a8ae;--gc-soft:rgba(142,150,170,.16);
  --mark:rgba(234,179,8,.3);
}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--t1);font:15px/1.65 var(--font)}
.bar{position:fixed;top:0;left:0;right:0;height:var(--bar);display:flex;align-items:center;gap:8px;
  padding:0 14px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--divider);z-index:50}
.bar h1{font-size:15px;margin:0;font-weight:650;white-space:nowrap;cursor:pointer}
.bar h1 small{font-weight:400;color:var(--t3);margin-left:6px;font-size:11px}
.bar input{flex:1;min-width:60px;max-width:480px;height:34px;border:1px solid var(--divider);border-radius:9px;
  background:var(--bg-elv);color:var(--t1);padding:0 12px;font:13.5px var(--font);outline:none}
.bar input:focus{border-color:var(--brand-2)}
.btn{height:34px;padding:0 12px;border:1px solid var(--divider);border-radius:9px;background:var(--bg-elv);
  color:var(--t2);font:13px var(--font);cursor:pointer;white-space:nowrap}
.btn:hover{color:var(--t1)}
.btn.on{background:var(--brand-soft);color:var(--brand-1);border-color:var(--brand-2);font-weight:650}
button.tobooks{margin-left:auto}
#top{position:fixed;right:18px;bottom:18px;width:38px;height:38px;border-radius:50%;border:1px solid var(--divider);
  background:var(--bg-elv);color:var(--t2);font-size:16px;cursor:pointer;display:none;z-index:40;box-shadow:0 2px 10px rgba(0,0,0,.08)}

/* ---- 双栏：左 TOC + 右卡片流 ---- */
.wrap{display:flex;max-width:1280px;margin:0;padding-top:var(--bar)}
.toc{position:sticky;top:var(--bar);width:var(--side);flex:none;height:calc(100vh - var(--bar));overflow-y:auto;
  padding:14px 10px 30px 14px;border-right:1px solid var(--divider);scrollbar-width:thin}
.toc .brand{font-size:12.5px;color:var(--t3);margin:6px 4px 12px;line-height:1.6}
.toc a{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:5.5px 10px;border-radius:8px;
  color:var(--t2);text-decoration:none;font-size:13.5px}
.toc a:hover{background:var(--bg-mute);color:var(--t1)}
.toc a.on{background:var(--brand-soft);color:var(--brand-1);font-weight:650}
.toc a .n{font-size:11px;color:var(--t3);font-variant-numeric:tabular-nums;flex:none}
.toc a.on .n{color:var(--brand-1)}
.toc .tg{margin:9px 0 2px}
.toc .tg-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:7px 10px;border-radius:8px;
  color:var(--t1);font-weight:700;font-size:13.5px;cursor:pointer}
.toc .tg-h:hover{background:var(--bg-mute)}
.toc .tg-h.on{background:var(--brand-soft);color:var(--brand-1)}
.toc .tg-h .n{font-size:11px;color:var(--t3);font-variant-numeric:tabular-nums;flex:none}
.toc .tg-h.on .n{color:var(--brand-1)}
.toc a.sub{padding:4px 10px 4px 20px;font-size:12.5px;color:var(--t3)}

/* ---- 模块入口（首页） ---- */
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;margin:20px 0 6px}
.modc{border:1px solid var(--divider);border-radius:14px;background:var(--bg-elv);padding:17px 17px 14px;cursor:pointer;
  transition:border-color .15s,transform .15s;position:relative}
.modc:hover{border-color:var(--brand-2);transform:translateY(-1px)}
.modc .mn{font-size:17px;font-weight:750;color:var(--t1);padding-right:64px}
.modc .mh{font-size:13px;color:var(--t3);margin:4px 0 11px}
.modc .mc-chips{display:flex;flex-wrap:wrap;gap:6px}
.modc .mchip{font-size:11px;color:var(--t2);background:var(--bg-mute);border-radius:99px;padding:2.5px 9px}
.modc .mn2{position:absolute;top:15px;right:15px;font-size:11px;color:var(--brand-1);font-weight:700;
  background:var(--brand-soft);border-radius:99px;padding:3px 10px;font-variant-numeric:tabular-nums}

/* ---- 模块连读：章跳转 chips + 面包屑 ---- */
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 16px}
.chip{font-size:12px;color:var(--t2);background:var(--bg-mute);border-radius:99px;padding:4px 11px;cursor:pointer;
  border:0;font-family:inherit;font-variant-numeric:tabular-nums}
.chip:hover{color:var(--brand-1);background:var(--brand-soft)}
.bc{font-size:12.5px;color:var(--t3);margin:10px 0 0}
.bc a{color:var(--brand-1);text-decoration:none;cursor:pointer}
.bc a:hover{text-decoration:underline}
.chip.on{color:var(--brand-1);background:var(--brand-soft);font-weight:650}
.modband{margin:26px 0 8px;padding:10px 14px;background:var(--brand-soft);border-radius:10px;
  font-weight:700;color:var(--brand-1);font-size:14.5px;scroll-margin-top:calc(var(--bar) + 8px)}
.modband:first-child{margin-top:4px}
.modband .n{font-weight:500;font-size:12px;color:var(--t3);margin-left:10px}
.toc .tg a.sub{display:none}
.toc .tg.open a.sub{display:flex}
.stream{flex:1;min-width:0;padding:20px 26px 80px}
.loading,.empty{color:var(--t3);padding:40px;text-align:center;font-size:14px}

/* ---- 章 ---- */
.chap{margin:34px 0 14px;scroll-margin-top:calc(var(--bar) + 8px)}
.chap:first-child{margin-top:8px}
.chap .cid{font-size:11px;color:var(--brand-1);font-weight:700;letter-spacing:.08em}
.chap h2{font-size:21px;margin:2px 0 4px;font-weight:700}
.chap .cdesc{font-size:13px;color:var(--t3);margin:0 0 14px;max-width:640px}

/* ---- 卡片 ---- */
.card{border:1px solid var(--divider);border-radius:12px;background:var(--bg-elv);margin-bottom:12px;overflow:hidden;
  break-inside:avoid;transition:border-color .15s}
.card:hover{border-color:var(--brand-2)}
.chead{display:flex;align-items:flex-start;gap:10px;padding:13px 15px 11px;cursor:pointer}
.chead .no{flex:none;font-size:11px;color:var(--t3);font-variant-numeric:tabular-nums;padding-top:3px;min-width:44px}
.chead .tt{flex:1;font-weight:650;font-size:15px;line-height:1.5}
.chead .bdg{flex:none;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:99px;margin-top:2px}
.bdg-A{color:var(--ga);background:var(--ga-soft)}
.bdg-B{color:var(--gb);background:var(--gb-soft)}
.bdg-C{color:var(--gc);background:var(--gc-soft)}
.cbody{padding:0 15px 13px 69px;display:none}
.card.open .cbody{display:block}
.cbody .say{font-size:14px;color:var(--t2);line-height:1.7;white-space:pre-wrap}
.cbody .src{margin-top:9px;font-size:12px;color:var(--t3);cursor:pointer}
.cbody .src:hover{color:var(--brand-1)}
.ria-box{margin-top:10px;border-left:3px solid var(--brand-soft);padding:2px 0 2px 12px;display:none}
.ria-box.show{display:block}
.ria-box .rrow{margin:9px 0}
.ria-box .rl{font-size:11px;font-weight:700;color:var(--brand-1);letter-spacing:.06em}
.ria-box .rv{font-size:13.5px;color:var(--t2);margin-top:2px;white-space:pre-wrap}
.ria-box .rv p{margin:.35em 0}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
.hnt{font-size:11px;color:var(--t3);padding:6px 0 0}

/* ---- 便签练武场 ---- */
.np-box{margin-top:12px;border-top:1px dashed var(--divider);padding-top:10px}
.np-box .np-t{font-size:12px;font-weight:700;color:var(--brand-1);letter-spacing:.05em;display:flex;align-items:center;gap:8px}
.np-box .np-t .done{font-size:10.5px;color:#fff;background:var(--ga);padding:1px 8px;border-radius:99px;font-weight:700}
.np-area{width:100%;box-sizing:border-box;margin-top:8px;border:1px solid var(--divider);border-radius:8px;background:var(--bg);
  color:var(--t1);font:13px/1.6 var(--font);padding:8px 10px;resize:vertical;min-height:56px}
.np-area:focus{outline:none;border-color:var(--brand-2)}
.np-row{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.btn{border:1px solid var(--brand-2);background:var(--brand-1);color:#fff;font:12.5px var(--font);font-weight:650;
  padding:5px 14px;border-radius:8px;cursor:pointer}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:transparent;color:var(--brand-1)}
.np-verdict{margin-top:9px;border-radius:8px;padding:8px 11px;font-size:12.5px;line-height:1.6}
.np-verdict.ok{background:var(--ga-soft);color:var(--ga)}
.np-verdict.no{background:var(--gc-soft);color:var(--gc)}
.np-verdict b{font-size:13px}
.np-verdict .tip{display:block;margin-top:2px;color:var(--t2)}
.card.done .chead .tt::after{content:"✓ 已练";font-size:10.5px;color:var(--ga);font-weight:700;margin-left:8px}

/* ---- 每日一拆 / 地图 / 海报 ---- */
.daily-hero{border:1px solid var(--divider);border-radius:14px;background:var(--bg-elv);padding:18px 20px;margin-bottom:16px}
.daily-hero .dt{font-size:12px;color:var(--brand-1);font-weight:700;letter-spacing:.08em}
.daily-hero .dh{font-size:19px;font-weight:750;margin:6px 0 2px}
.daily-hero .dm{font-size:12.5px;color:var(--t3)}
.daily-hero .dr{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap;font-size:12.5px;color:var(--t2)}
.streak{font-weight:750;color:var(--brand-1)}
.mapgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.modcard{border:1px solid var(--divider);border-radius:12px;background:var(--bg-elv);padding:14px 16px}
.modcard .mh1{font-weight:750;font-size:14.5px;display:flex;justify-content:space-between;align-items:baseline}
.modcard .mh1 .pct{font-size:11.5px;color:var(--brand-1);font-weight:700}
.chgrid{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.chdot{position:relative;width:34px;height:34px;border-radius:9px;border:1px solid var(--divider);display:flex;flex-direction:column;
  align-items:center;justify-content:center;font-size:10px;color:var(--t3);cursor:pointer;font-variant-numeric:tabular-nums}
.chdot:hover{border-color:var(--brand-2)}
.chdot .nm{max-width:32px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:8.5px}
.chdot.v1{background:var(--brand-soft);border-color:var(--brand-2);color:var(--brand-1)}
.chdot.v2{background:var(--ga-soft);border-color:var(--ga);color:var(--ga);font-weight:700}
.chdot .lv{font-size:11px;font-weight:750;line-height:1}
.poster-wrap{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:80;display:none;align-items:center;justify-content:center;padding:20px}
.poster-wrap.show{display:flex}
.poster-card{background:var(--bg-elv);border-radius:14px;padding:18px;max-width:92vw;max-height:92vh;overflow:auto}
.poster-card canvas{border-radius:10px;max-width:100%;height:auto;display:block}
.poster-acts{display:flex;gap:10px;margin-top:12px;justify-content:center;flex-wrap:wrap}
.poster-acts .btn.ghost{border-color:var(--divider)}

/* ---- AI 助手 ---- */
#aiFab{position:fixed;right:18px;bottom:64px;height:38px;padding:0 16px;border-radius:99px;border:1px solid var(--brand-2);
  background:var(--brand-1);color:#fff;font:13.5px var(--font);font-weight:650;cursor:pointer;z-index:45;
  box-shadow:0 2px 12px rgba(0,0,0,.15)}
#aiFab:hover{filter:brightness(1.08)}
#aiPanel{position:fixed;right:18px;bottom:110px;width:372px;max-width:calc(100vw - 24px);height:500px;max-height:calc(100vh - 130px);
  display:none;flex-direction:column;border:1px solid var(--divider);border-radius:14px;background:var(--bg-elv);
  z-index:46;box-shadow:0 8px 32px rgba(0,0,0,.18);overflow:hidden}
#aiPanel.show{display:flex}
.ai-hd{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--divider);
  background:var(--brand-soft)}
.ai-hd b{font-size:14px;color:var(--brand-1)}
.ai-hd .x{cursor:pointer;color:var(--t3);font-size:16px;padding:0 4px}
.ai-hd .x:hover{color:var(--t1)}
.ai-tip{font-size:11px;color:var(--t3);padding:6px 14px;border-bottom:1px solid var(--divider);line-height:1.5}
#aiMsgs{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px;scrollbar-width:thin}
.ai-m{max-width:88%;padding:9px 12px;border-radius:11px;font-size:13.5px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.ai-m.u{align-self:flex-end;background:var(--brand-soft);color:var(--t1)}
.ai-m.a{align-self:flex-start;background:var(--bg-mute);color:var(--t1)}
.ai-m.a .cit{display:inline-block;min-width:16px;text-align:center;margin:0 1px;padding:0 4px;border-radius:6px;
  background:var(--brand-soft);color:var(--brand-1);font-size:11px;font-weight:700;cursor:default}
.ai-refs{align-self:flex-start;display:flex;flex-wrap:wrap;gap:5px;max-width:100%}
.ai-ref{font-size:11px;color:var(--brand-1);background:var(--brand-soft);border:1px solid var(--divider);
  border-radius:8px;padding:2px 8px;cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ai-ref:hover{border-color:var(--brand-2)}
.ai-m.err{align-self:flex-start;background:transparent;border:1px dashed var(--divider);color:var(--t3)}
#aiForm{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--divider)}
#aiQ{flex:1;height:36px;border:1px solid var(--divider);border-radius:9px;background:var(--bg);color:var(--t1);
  padding:0 11px;font:13.5px var(--font);outline:none}
#aiQ:focus{border-color:var(--brand-2)}
#aiForm button{height:36px;padding:0 16px;border:none;border-radius:9px;background:var(--brand-1);color:#fff;
  font:13.5px var(--font);font-weight:650;cursor:pointer}
#aiForm button:disabled{opacity:.5;cursor:wait}

@media (max-width:860px){
  .toc{display:none}
  .stream{padding:14px 12px 70px}
  .cbody{padding-left:15px}
  .chead .no{display:none}
  .bar input{max-width:none}
}
@media print{
  .bar,.toc,#top,.hnt,#posterWrap,#aiFab,#aiPanel{display:none!important}
  .wrap{padding-top:0}
  .card{break-inside:avoid}
  .cbody{display:block}
}
</style>
</head>
<body>
<header class="bar">
  <h1 id="home">chailive<small>拆生活指南</small></h1>
  <input id="q" type="search" placeholder="搜主题 / 说人话 / 书名…" autocomplete="off">
  <button class="btn mode" data-m="all">全部</button>
  <button class="btn mode" data-m="say">只看说人话</button>
  <button class="btn" id="theme">明暗</button>
  <button class="btn tobooks" onclick="location.href='books.html'">书库</button>
</header>
<div class="wrap">
  <nav class="toc" id="toc"><div class="loading">加载中…</div></nav>
  <main class="stream" id="stream"><div class="loading">加载中…</div></main>
</div>
<button id="top" title="回到顶部">↑</button>
<button id="aiFab">✨ 问我</button>
<div id="aiPanel">
  <div class="ai-hd"><b>AI 拆书助手</b><span class="x" id="aiClose">✕</span></div>
  <div class="ai-tip">基于本站 19262 张拆页卡片回答。点回答里的 <span class="cit">1</span> 可跳到对应卡片。</div>
  <div id="aiMsgs"></div>
  <form id="aiForm"><input id="aiQ" type="text" placeholder="问问看：怎么跟青春期孩子说话？" autocomplete="off"><button id="aiGo" type="submit">发送</button></form>
</div>
<div id="posterWrap" class="poster-wrap" onclick="if(event.target===this)closePoster()">
  <div class="poster-card"><div class="poster-acts">
    <button class="btn" onclick="dlPoster()">保存图片</button>
    <button class="btn ghost" onclick="cpPoster()">复制链接</button>
    <button class="btn ghost" onclick="closePoster()">关闭</button>
  </div></div>
</div>
<script src="data/chapters.js"></script>
<script>
(function(){
"use strict";
var CHAPS=window.CHAI_CHAPTERS||[], CARDS=window.CHAI_CARDS||[], MODS=window.CHAI_MODS||[];
var toc=document.getElementById('toc'), stream=document.getElementById('stream'), q=document.getElementById('q');
var st={mode:'all',q:'',ch:null,mod:null,all:false,filtered:null};
var loaded={}, PD=window.CHAI_PD=window.CHAI_PD||{};

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function hl(s,kw){s=esc(s);if(!kw)return s;try{return s.replace(new RegExp(kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),function(m){return '<mark>'+m+'</mark>'})}catch(e){return s}}
function modOf(chid){for(var i=0;i<MODS.length;i++)if(MODS[i].chs.indexOf(chid)>=0)return MODS[i];return null}
function modById(id){for(var i=0;i<MODS.length;i++)if(MODS[i].id===id)return MODS[i];return null}
function chapById(id){for(var i=0;i<CHAPS.length;i++)if(CHAPS[i].id===id)return CHAPS[i];return null}
function applyTheme(t){document.documentElement.dataset.theme=t;localStorage.setItem('cfl-theme',t)}
applyTheme(localStorage.getItem('cfl-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));
document.getElementById('theme').onclick=function(){applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark')};
document.getElementById('home').onclick=function(){location.hash=''};
window.__clAll=function(){location.hash='all'};
function go(h){if(location.hash===h)route();else location.hash=h}
window.addEventListener('hashchange',route);
window.addEventListener('scroll',function(){document.getElementById('top').style.display=scrollY>600?'block':'none'});
document.getElementById('top').onclick=function(){scrollTo({top:0,behavior:'smooth'})};
Array.prototype.forEach.call(document.querySelectorAll('.mode'),function(b){
  b.onclick=function(){
    st.mode=b.dataset.m;st.modeLabel=b.textContent;
    Array.prototype.forEach.call(document.querySelectorAll('.mode'),function(x){x.classList.toggle('on',x===b)});
    if(st.q||st.mode!=='all')renderFilteredFlat();else route();
  };
});
document.querySelector('.mode[data-m="all"]').classList.add('on');
q.addEventListener('input',function(){st.q=q.value.trim();if(st.q)renderFilteredFlat();else route()});

// ---------- 过滤 ----------
function pass(c){
  if(st.mode==='a'&&c.g!=='A')return false;
  if(st.mode==='say'&&!c.r)return false;
  if(st.q){
    var k=st.q.toLowerCase();
    if((c.t||'').toLowerCase().indexOf(k)<0&&(c.r||'').toLowerCase().indexOf(k)<0&&(c.s||'').toLowerCase().indexOf(k)<0)return false;
  }
  return true;
}
function computeFiltered(){
  st.filtered=CARDS.filter(pass);
}

// ---------- TOC（按模块分组） ----------
var tocLinks=[];
function buildToc(){

function tocSync(){
  var allLink=toc.querySelector('a[data-id="__all"]');
  if(allLink)allLink.classList.toggle('on',st.view==='all');
  [].slice.call(toc.querySelectorAll('.tg')).forEach(function(tg){
    var id=tg.dataset.mg;
    var moOn=st.view==='mod'&&st.mod===id;
    var chOn=false;
    [].slice.call(tg.querySelectorAll('a.sub')).forEach(function(a){
      var on=st.view==='chap'&&st.ch===a.dataset.id;
      a.classList.toggle('on',on);
      if(on)chOn=true;
    });
    var hd=tg.querySelector('.tg-h');
    if(hd)hd.classList.toggle('on',moOn);
    if(moOn||chOn)tg.classList.add('open');
  });
}

// ---------- RIA 懒加载（data/<bid>.js + part 定位）----------
function loadScript(src){return new Promise(function(res,rej){
  var s=document.createElement('script');s.src=src;s.onload=res;s.onerror=function(){rej(new Error(src))};
  document.head.appendChild(s);
})}
function findPart(bd,mid){
  var np=bd.np||1;if(np<=1)return 1;
  var pb=bd.pb,lo=0,hi=pb.length-1;
  while(lo<hi){var m=(lo+hi)>>1;if(mid<=pb[m])hi=m;else lo=m+1}
  return lo+1;
}
function findMemoir(bd,mid){
  var pi=findPart(bd,mid);
  var arr=pi===1?bd.ms:PD[bd.book.id+'_'+pi];
  if(!arr)return null;
  for(var k=0;k<arr.length;k++)if(String(arr[k].id)===String(mid))return arr[k];
  return null;
}
window.__clFill=function(card){
  var bid=card.dataset.b, mid=card.dataset.i, box=card.querySelector('.ria-box');
  var cc=CARDS.filter(function(x){return x.b===bid&&String(x.i)===String(mid)})[0];
  if(cc){markVisited(cc.c);mountPractice(card,cc)}
  if(!card.dataset.x||card.dataset.x==='0'){box.innerHTML='<div class="rv hnt">该拆页无 RIA 便签</div>';box.classList.add('show');return}
  box.innerHTML='<div class="rv hnt">RIA 加载中…</div>';box.classList.add('show');
  var p1=loaded[bid]||(loaded[bid]=loadScript('data/'+bid+'.js').then(function(){
    return (window.CHAI_DATA||{})[bid];
  }));
  p1.then(function(bd){
    if(!bd)throw new Error('no shard');
    var pi=findPart(bd,mid);
    if(pi===1||bd.np<=1)return bd;
    var key=bd.book.id+'_'+pi;
    if(PD[key])return bd;
    return loadScript('data/'+bd.book.id+'.p'+pi+'.js').then(function(){return bd});
  }).then(function(bd){
    var m=findMemoir(bd,mid);
    if(!m){box.innerHTML='<div class="rv hnt">未找到拆页正文</div>';return}
    var h='';
    if(m.prologue)h+='<div class="rrow"><div class="rl">引言</div><div class="rv">'+m.prologue+'</div></div>';
    (m.texts||[]).forEach(function(t){
      var fl=t.flags||{};
      if(fl.r&&t.quote)h+='<div class="rrow"><div class="rl">R · 原文</div><div class="rv">'+t.quote+'</div></div>';
      if(fl.i&&t.explains)h+='<div class="rrow"><div class="rl">I · 重述</div><div class="rv">'+t.explains+'</div></div>';
      if(fl.a&&t.interaction)h+='<div class="rrow"><div class="rl">A · 应用</div><div class="rv">'+t.interaction+'</div></div>';
    });
    if(!h)h='<div class="rv hnt">该拆页便签为空</div>';
    box.innerHTML=h;
  }).catch(function(){box.innerHTML='<div class="rv hnt">RIA 加载失败</div>'});
};

// ---------- 进度存档（localStorage：visited 章 / practiced 卡 / daily 打卡）----------
var PKEY='cl2-progress';
function loadProg(){try{return JSON.parse(localStorage.getItem(PKEY))||{v:{},p:{},d:{}}}catch(e){return{v:{},p:{},d:{}}}}
function saveProg(pg){try{localStorage.setItem(PKEY,JSON.stringify(pg))}catch(e){}}
var PROG=loadProg();
function markVisited(cid){if(!cid||PROG.v[cid])return;PROG.v[cid]=1;saveProg(PROG)}
function markPracticed(cid,key){if(!key)return;PROG.p[key]={c:cid,t:Date.now(),sc:PROG.p[key]?PROG.p[key].sc:0};if(cid)PROG.v[cid]=1;saveProg(PROG)}
function bjDay(){var d=new Date(Date.now()+8*3600e3);return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0')}
function streak(){
  var days=Object.keys(PROG.d).sort(),n=0,today=bjDay();
  if(!days.length)return 0;
  var d=new Date(Date.parse(today)+8*3600e3);
  for(var i=0;i<400;i++){
    var ds=new Date(d.getTime()-i*86400e3+8*3600e3);
    var k=ds.getUTCFullYear()+'-'+String(ds.getUTCMonth()+1).padStart(2,'0')+'-'+String(ds.getUTCDate()).padStart(2,'0');
    if(PROG.d[k])n++;else if(i===0)continue;else break;
  }
  return n;
}

// ---------- 每日一拆选卡：北京时间日期做种子，从 A 级 RIA 卡里确定性轮换 ----------
function dailyCard(){
  var pool=CARDS.filter(function(c){return c.g==='A'&&c.x});
  var day=bjDay(),seed=0;
  for(var i=0;i<day.length;i++)seed=(seed*31+day.charCodeAt(i))>>>0;
  return pool[seed%pool.length];
}

// ---------- 便签练武场：挂载到卡片 np-box ----------
var RV_URL='https://dopenclaw.aibay.asia/cl2-ai/review';
function mountPractice(card,c){
  var box=card.querySelector('.np-box');if(!box)return;
  var key=c.b+'_'+c.i,done=PROG.p[key];
  if(done&&done.sc>=4){
    box.innerHTML='<div class="np-t">练武场<span class="done">✓ 已练 '+done.sc+'/6 分</span></div>'
      +'<div class="np-verdict ok" style="margin-top:8px">'+esc(done.vd||'评审已通过')+'</div>'
      +'<div class="np-row"><button class="btn ghost" data-np="redo">再练一次</button><button class="btn ghost" data-np="poster">生成海报</button></div>';
  }else{
    box.innerHTML='<div class="np-t">练武场 · 写我的便签</div>'
      +'<textarea class="np-area" data-np="a1" placeholder="A1 我的相关经历：什么场景下遇到过拆页讲的问题？当时怎么做的？"></textarea>'
      +'<textarea class="np-area" data-np="a2" placeholder="A2 我要怎么用：具体场景 + 可验证的行动 + 期限"></textarea>'
      +'<div class="np-row"><button class="btn" data-np="go">交 AI 评审员</button><span style="font-size:11px;color:var(--t3)">评审维度：A1 是否具体有场景；A2 是否可执行（SMART）</span></div>'
      +'<div class="np-verdict" data-np="out" style="display:none"></div>';
  }
  var out=box.querySelector('[data-np="out"]');
  function showResult(r){
    out.style.display='block';out.className='np-verdict '+(r.pass?'ok':'no');
    var h='<b>'+(r.pass?'通过':'再改改')+' · '+r.score+'/6</b> '+esc(r.verdict||'');
    (r.tips||[]).forEach(function(t){h+='<span class="tip">· '+esc(t)+'</span>'});
    out.innerHTML=h;
  }
  box.onclick=function(ev){
    var t=ev.target;
    if(t.dataset&&t.dataset.np==='go'){
      var a1=(box.querySelector('[data-np="a1"]')||{}).value||'',a2=(box.querySelector('[data-np="a2"]')||{}).value||'';
      if(a1.trim().length<10||a2.trim().length<10){showResult({pass:false,score:0,verdict:'A1/A2 各至少写 10 个字',tips:[]});return}
      t.disabled=true;t.textContent='评审中…';
      fetch(RV_URL,{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({card:{t:c.t,r:(c.r||'').slice(0,300),s:c.s},a1:a1.slice(0,800),a2:a2.slice(0,800)})})
      .then(function(r){return r.json()}).then(function(r){
        if(r.error)throw new Error(r.error);
        showResult(r);
        if(r.pass){
          PROG.p[key]={c:c.c,t:Date.now(),sc:r.score,vd:r.verdict};
          if(c.c)PROG.v[c.c]=1;
          PROG.d[bjDay()]=1;saveProg(PROG);
          card.classList.add('done');t.textContent='✓ 已通过';setTimeout(function(){mountPractice(card,c)},1200);
        }else{t.disabled=false;t.textContent='再交一次'}
      }).catch(function(e){showResult({pass:false,score:0,verdict:'评审员暂时不在（'+e.message+'），稍后再试',tips:[]});t.disabled=false;t.textContent='再交一次'});
    }else if(t.dataset&&t.dataset.np==='redo'){
      delete PROG.p[key];saveProg(PROG);mountPractice(card,c);
    }else if(t.dataset&&t.dataset.np==='poster'){
      openPoster(c,key);
    }
  };
}

function showMap(){
  var h='<div class="bc"><a href="#" data-go="home">首页</a> › 知识地图</div>';

  var totV=0,totP=0;
  MODS.forEach(function(mo){
    var v=0,pr=0;
    mo.chs.forEach(function(cid){if(PROG.v[cid])v++;pr+=Object.keys(PROG.p).filter(function(k){return PROG.p[k].c===cid}).length});
    totV+=v;totP+=pr;
    var pct=Math.round(v/mo.chs.length*100);
    h+='<div class="modcard"><div class="mh1"><span>'+esc(mo.name)+'</span><span class="pct">'+v+'/'+mo.chs.length+' 章 · '+pct+'%</span></div><div class="chgrid">';
    mo.chs.forEach(function(cid){
      var cp2=chapById(cid);if(!cp2)return;
      var practiced=Object.keys(PROG.p).some(function(k){return PROG.p[k].c===cid});
      var cls=practiced?'v2':(PROG.v[cid]?'v1':'');
      h+='<div class="chdot '+cls+'" data-go="c" data-c="'+cid+'" title="'+esc(cp2.name)+'"><span class="lv">'+cid.replace('ch','')+'</span><span class="nm">'+esc(cp2.name)+'</span></div>';
    });
    h+='</div></div>';
  });
  h+='<div class="empty">已点亮 '+totV+'/'+CHAPS.length+' 章 · 累计便签 '+totP+' 张 · <a href="#" data-go="poster" style="color:var(--brand-1)">生成我的成就海报</a></div>';
  stream.innerHTML=h;
  tocSync();
}

// ---------- 分享海报（canvas 零依赖）----------
function rr(g,x,y,w,h,r){
  if(g.roundRect){g.beginPath();g.roundRect(x,y,w,h,r);g.fill();return}
  g.fillRect(x,y,w,h);
}
function wrapText(g,txt,x,y,w,lh){
  var line='',yy=y;
  for(var i=0;i<txt.length;i++){
    var test=line+txt[i];
    if(g.measureText(test).width>w&&line){g.fillText(line,x,yy);line=txt[i];yy+=lh}else line=test;
  }
  if(line){g.fillText(line,x,yy);yy+=lh}
  return yy;
}
function drawPoster(cv,info){
  var W=750,H=1000;cv.width=W;cv.height=H;
  var g=cv.getContext('2d');
  var dark=document.documentElement.dataset.theme==='dark';
  g.fillStyle=dark?'#16181d':'#f7f5f0';g.fillRect(0,0,W,H);
  g.fillStyle='#c96442';g.fillRect(0,0,W,8);
  g.fillStyle=dark?'#e8e4da':'#2b2b28';
  g.font='700 46px sans-serif';g.fillText('拆学习 · 拆生活指南',48,110);
  g.font='400 24px sans-serif';g.fillStyle=dark?'#9aa0a8':'#8a857a';
  g.fillText('chailive · 每天拆一页，生活好一点',48,152);
  g.strokeStyle=dark?'#2e3238':'#e5e0d5';g.beginPath();g.moveTo(48,190);g.lineTo(W-48,190);g.stroke();
  var y=260;
  if(info.mode==='card'){
    g.fillStyle='#c96442';g.font='700 22px sans-serif';g.fillText('今日一拆',48,y);y+=54;
    g.fillStyle=dark?'#e8e4da':'#2b2b28';g.font='700 34px sans-serif';
    y=wrapText(g,info.t,48,y,W-96,46);
    g.font='400 22px sans-serif';g.fillStyle=dark?'#9aa0a8':'#8a857a';
    g.fillText('《'+info.s+'》',48,y);y+=72;
    g.fillStyle='#c96442';g.font='700 22px sans-serif';g.fillText('我的便签评审 · '+info.score+'/6 分',48,y);y+=44;
    g.fillStyle=dark?'#9aa0a8':'#8a857a';g.font='400 20px sans-serif';
    y=wrapText(g,info.vd||'评审通过',48,y,W-96,32);
  }else{
    g.fillStyle='#c96442';g.font='700 22px sans-serif';g.fillText('我的知识地图',48,y);y+=70;
    g.fillStyle=dark?'#e8e4da':'#2b2b28';g.font='700 72px sans-serif';
    g.fillText(info.lit+'/'+info.total,48,y);y+=44;
    g.font='400 24px sans-serif';g.fillStyle=dark?'#9aa0a8':'#8a857a';
    g.fillText('章已点亮 · 累计便签 '+info.notes+' 张 · 连续 '+info.streak+' 天',48,y);y+=76;
    var cols=10,cw=(W-96)/cols,ch=26;
    for(var i=0;i<info.total;i++){
      var cid='ch'+String(i+1).padStart(2,'0');
      var practiced=Object.keys(PROG.p).some(function(k){return PROG.p[k].c===cid});
      var visited=!!PROG.v[cid];
      g.fillStyle=practiced?'#c96442':(visited?(dark?'#8a5a44':'#eec9b7'):(dark?'#2e3238':'#ece8de'));
      rr(g,48+(i%cols)*cw,y+Math.floor(i/cols)*ch,cw-6,ch-6,6);
    }
  }
  g.fillStyle=dark?'#9aa0a8':'#8a857a';g.font='400 20px sans-serif';
  g.fillText('www.aibay.asia/chailive/',48,H-52);
}
var posterCv=document.createElement('canvas');
function openPoster(c,key){
  var rec=key?PROG.p[key]:null;
  var info=rec?{mode:'card',t:c.t,s:c.s,score:rec.sc,vd:rec.vd||'评审通过'}
    :{mode:'map',lit:Object.keys(PROG.v).length,total:CHAPS.length,notes:Object.keys(PROG.p).length,streak:streak()};
  drawPoster(posterCv,info);
  var wrap=document.getElementById('posterWrap');
  wrap.classList.add('show');
  var stage=wrap.querySelector('canvas.stage');if(stage)stage.remove();
  posterCv.className='stage';wrap.querySelector('.poster-card').insertBefore(posterCv,wrap.querySelector('.poster-acts'));
}
function closePoster(){document.getElementById('posterWrap').classList.remove('show')}
function dlPoster(){
  try{
    var a=document.createElement('a');a.download='chailive-'+bjDay()+'.png';a.href=posterCv.toDataURL('image/png');a.click();

}
function cpPoster(){

window.openPoster=openPoster;window.closePoster=closePoster;window.dlPoster=dlPoster;window.cpPoster=cpPoster;window.drawPoster=drawPoster;

// ---------- AI 助手（检索拆页片段 → dopenclaw 轻代理 → GLM 作答带引用）----------
var AI_URL='https://dopenclaw.aibay.asia/cl2-ai/ask';
var aiPanel=document.getElementById('aiPanel'),aiFab=document.getElementById('aiFab'),
    aiMsgs=document.getElementById('aiMsgs'),aiForm=document.getElementById('aiForm'),
    aiQ=document.getElementById('aiQ'),aiGo=document.getElementById('aiGo'),
    aiClose=document.getElementById('aiClose');
aiFab.onclick=function(){aiPanel.classList.toggle('show');if(aiPanel.classList.contains('show'))aiQ.focus()};
aiClose.onclick=function(){aiPanel.classList.remove('show')};
function tokenize(q){
  var parts=String(q||'').toLowerCase().split(/[\s，。？！、,.?!'"]+/).filter(function(w){return w.length>=2});
  var out=[];
  parts.forEach(function(w){
    if(/^[a-z0-9]+$/.test(w)){out.push(w);return}
    for(var i=0;i<w.length-1;i++)out.push(w.substr(i,2));
  });
  return out;
}
function retrieve(q){
  var kws=tokenize(q);
  if(!kws.length)return CARDS.slice(0,6);
  var scored=CARDS.map(function(c){
    var t=(c.t||'').toLowerCase(),r=(c.r||'').toLowerCase(),s=(c.s||'').toLowerCase(),sc=0;
    kws.forEach(function(k){
      if(t.indexOf(k)>=0)sc+=3;
      if(r.indexOf(k)>=0)sc+=2;
      if(s.indexOf(k)>=0)sc+=1;
    });
    if(c.g==='A')sc+=0.4;else if(c.g==='B')sc+=0.2;
    return {c:c,sc:sc};
  }).filter(function(x){return x.sc>0});
  scored.sort(function(a,b){return b.sc-a.sc});
  return scored.slice(0,8).map(function(x){return x.c});
}
var CHNAME={};
CHAPS.forEach(function(c){CHNAME[c.id]=c.name});
function scrollCard(i){
  var el=document.querySelector('.card[data-ai="'+i+'"]');
  if(!el)return;
  el.scrollIntoView({behavior:'smooth',block:'center'});
  el.style.borderColor='var(--brand-1)';
  setTimeout(function(){el.style.borderColor=''},1800);
}
function aiAdd(cls,text){
  var d=document.createElement('div');
  d.className='ai-m '+cls;
  d.textContent=text;
  aiMsgs.appendChild(d);
  aiMsgs.scrollTop=aiMsgs.scrollHeight;
  return d;
}
function aiRefsRow(refs){
  var row=document.createElement('div');
  row.className='ai-refs';
  refs.forEach(function(r){
    var b=document.createElement('span');
    b.className='ai-ref';
    b.textContent='［'+r.i+'］'+(r.t||'')+(r.s?' ·《'+r.s+'》':'');
    b.onclick=function(){scrollCard(r.i)};
    row.appendChild(b);
  })
  aiMsgs.appendChild(row);
  aiMsgs.scrollTop=aiMsgs.scrollHeight;
}
function renderAnswer(el,refs){
  var parts=String(el.textContent).split(/([［\[]\d+[］\]])/);
  el.textContent='';
  parts.forEach(function(p){
    var m=p.match(/^[［\[](\d+)[］\]]$/);
    if(m){
      var i=+m[1];
      var s=document.createElement('span');
      s.className='cit';s.textContent=i;
      s.title=refs[i-1]?(refs[i-1].t||''):'';
      s.onclick=function(){scrollCard(i)};
      el.appendChild(s);
    }else if(p){el.appendChild(document.createTextNode(p))}
  });
}
function tagRefCards(refs){
  document.querySelectorAll('.card[data-ai]').forEach(function(el){el.removeAttribute('data-ai')});
  refs.forEach(function(r){
    var c=AI_CTX[r.i-1];
    if(!c)return;
    var el=document.querySelector('.card[data-b="'+c.b+'"][data-i="'+c.i+'"]');
    if(el)el.setAttribute('data-ai',r.i);
  });
}
var AI_CTX=[];
aiForm.onsubmit=function(e){
  e.preventDefault();
  var q=aiQ.value.trim();
  if(!q)return;
  aiAdd('u',q);
  aiQ.value='';aiGo.disabled=true;
  var wait=aiAdd('a','翻卡片中…');
  AI_CTX=retrieve(q);
  var ctx=AI_CTX.map(function(c){
    return {t:c.t,r:c.r,s:c.s,g:c.g,ch:CHNAME[c.c]||c.c};
  });
  fetch(AI_URL,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({q:q,ctx:ctx})})
  .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j}})})
  .then(function(res){
    wait.remove();
    if(!res.ok||!res.j.a){aiAdd('err',(res.j&&res.j.error)||'AI 暂时不可用，稍后再试');return}
    var el=aiAdd('a',res.j.a);
    renderAnswer(el,res.j.refs||[]);
    aiRefsRow(res.j.refs||[]);
    tagRefCards(res.j.refs||[]);
  })
  .catch(function(){wait.remove();aiAdd('err','网络不给力，稍后再试')})
  .then(function(){aiGo.disabled=false});
};
})();
</script>
